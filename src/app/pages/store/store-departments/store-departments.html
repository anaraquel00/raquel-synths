<section class="department-sector" ngSkipHydration>
  <div class="cards-grid">
    @for (item of departments; track item.id) {
      <article class="dept-card" [ngClass]="item.id">
        <div class="card-image">
          <img
            [src]="item.image"
            [alt]="item.title"
            loading="lazy">
          <div class="overlay"></div>
        </div>

        <div class="card-content">
          <div class="sector-meta">
            <span>
              {{ productCounts[item.id] || 0 }}
              {{ currentLang === 'pt' ? 'produtos' : 'products' }}
            </span>
          </div>

          <h3>{{ item.title }}</h3>

          <p>{{ item.description[currentLang] }}</p>

          <button
            type="button"
            class="shop-btn"
            (click)="onCardClick(item.id, $event)"
            [attr.aria-label]="(currentLang === 'pt' ? 'Explorar ' : 'Explore ') + item.title">
            {{ currentLang === 'pt' ? 'EXPLORAR' : 'EXPLORE' }}
          </button>
        </div>
      </article>
    }
  </div>
</section>

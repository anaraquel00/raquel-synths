<div class="compliance-page">
  <h1>{{ data().title }}</h1>
  <p>{{ data().updatedText }}</p>

  <article>
    <h2>{{ data().privacyTitle }}</h2>
    <p>{{ data().privacyText }}</p>
    <p>{{ data().retentionText }}</p>
  </article>

  <article>
    <h2>{{ data().deletionTitle }}</h2>
    <p>{{ data().deletionText }}</p>
  </article>

  <article>
    <h2>{{ data().policyTitle }}</h2>
    <div class="text-content" [innerHTML]="data()?.policyText"></div>
  </article>

  <article>
    <h2>{{ data().lgpdTitle }}</h2>
    <div class="text-content" [innerHTML]="data()?.lgpdText"></div>
  </article>

  <article>
    <h2>{{ data().contactTitle }}</h2>
    <div class="text-content" [innerHTML]="data()?.contactText"></div>
  </article>
</div>

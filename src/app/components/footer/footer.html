<footer class="rqs-footer">
  <div class="footer-container">
    <div class="footer-column brand-column">
      <h2>{{ t.name }}</h2>
      <p>{{ t.madeby }}</p>
      <p (click)="togglePwaStealthMode()" class="copyright-line">
        {{ t.rights }}
      </p>
      <p>{{ t.owers }}</p>
      <p>{{ t.madeWith }}</p>
      <p>
        <a
          routerLink="/creator"
          class="tech-link"
          [attr.aria-label]="translate.isPt() ? 'Perfil da criadora' : 'Creator profile'"
        >
          {{ t.devProfile }}
        </a>
      </p>
      <p>
        <a
          routerLink="/compliance"
          class="compliance-link"
          [attr.aria-label]="translate.isPt() ? 'Política de Privacidade e Compliance' : 'Privacy Policy and Compliance'"
        >
          {{ t.compliance }}
        </a>
      </p>
    </div>

    <div class="footer-column">
      <h2>{{ t.listen }}</h2>
      <ul class="nav-list">
        <li>
          <a href="https://www.youtube.com/channel/UC4XQ29bhRmhxvYT9-4a9Otw" target="_blank" rel="noopener noreferrer">YouTube</a>
        </li>
        <li>
          <a href="https://open.spotify.com/intl-pt/artist/1yrPZaFyIcsCjj876LaHXL?si=Qd2pr8ueQPuF-OwfqKGMUQ" target="_blank" rel="noopener noreferrer">Spotify</a>
        </li>
        <li>
          <a href="https://soundcloud.com/you/albums" target="_blank" rel="noopener noreferrer">SoundCloud</a>
        </li>
        <li id="support-rqs" class="support-heading">
          <strong>{{ t.support }}</strong>
        </li>
        <li>
          <a [href]="paypalLink" target="_blank" rel="noopener noreferrer" class="donate-btn paypal">
            <mat-icon>public</mat-icon> PayPal (Intl.)
          </a>
        </li>
        <li>
          <button
            type="button"
            (click)="copyPix()"
            class="donate-btn pix"
            [attr.aria-label]="translate.isPt() ? 'Copiar chave PIX para apoiar a banda' : 'Copy PIX key to support the band'"
          >
            <mat-icon>pix</mat-icon> PIX (Brasil)
          </button>
        </li>
      </ul>
    </div>

    <div class="footer-column">
      <h2>{{ t.connect }}</h2>
      <ul class="nav-list">
        <li><a href="https://www.instagram.com/rqs_synths" target="_blank" rel="noopener noreferrer">Instagram</a></li>
        <li><a href="https://www.facebook.com/profile.php?id=61585926695560" target="_blank" rel="noopener noreferrer">Facebook</a></li>
        <li><a href="https://bsky.app/profile/raquelsynths.com" target="_blank" rel="noopener noreferrer">Bluesky</a></li>
      </ul>
    </div>
  </div>
</footer>

<mat-toolbar color="primary">
  <a routerLink="/" class="brand-logo" [attr.aria-label]="translate.isPt() ? 'Página inicial' : 'Home'">
    RQS &uArr;
  </a>

  <span class="spacer"></span>

  <div class="desktop-nav">
    <button
      mat-button
      type="button"
      (click)="mudarIdioma(translate.isPt() ? 'en' : 'pt')"
      [attr.aria-label]="translate.isPt() ? 'Mudar idioma para inglês' : 'Switch language to Portuguese'"
    >
      {{ translate.isPt() ? '🇺🇸 EN' : '🇧🇷 PT' }}
    </button>

    @if (!isJonahMode()) {
      <button mat-button type="button" class="jonah-trigger" (click)="activateJonahMode()">
        {{ navText.darkmode }}
      </button>
    } @else {
      <button mat-button type="button" class="broklin-escape" (click)="activateBroklinMode()">
        <mat-icon>shield</mat-icon>
        {{ navText.lightmode }}
      </button>
    }

    <button mat-button type="button" (click)="scrollTo('universe')">
      {{ translate.isPt() ? 'UNIVERSO' : 'UNIVERSE' }}
    </button>
    <button mat-button type="button" (click)="scrollTo('latest-signal')">
      {{ translate.isPt() ? 'ÚLTIMO SINAL' : 'LATEST SIGNAL' }}
    </button>
    <a mat-button routerLink="/creator" class="btn-creator">{{ navText.creator }}</a>
  </div>

  <button
    mat-icon-button
    type="button"
    [matMenuTriggerFor]="mobileMenu"
    class="mobile-menu-btn"
    [attr.aria-label]="translate.isPt() ? 'Abrir menu principal' : 'Open main menu'"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <mat-menu #mobileMenu="matMenu" xPosition="before" class="cyber-menu">
    <button mat-menu-item type="button" (click)="mudarIdioma(translate.isPt() ? 'en' : 'pt')">
      <mat-icon>translate</mat-icon>
      <span>{{ translate.isPt() ? 'Mudar para inglês' : 'Switch to Portuguese' }}</span>
    </button>

    @if (isJonahMode()) {
      <button mat-menu-item type="button" class="nav-item-broklin" (click)="activateBroklinMode()">
        <mat-icon>diamond</mat-icon>
        <span>{{ translate.isPt() ? 'Modo Broklin' : 'Broklin Mode' }}</span>
      </button>
    } @else {
      <button mat-menu-item type="button" class="nav-item-jonah" (click)="activateJonahMode()">
        <mat-icon>warning</mat-icon>
        <span>{{ translate.isPt() ? 'Modo Jonah' : 'Jonah Mode' }}</span>
      </button>
    }

    <mat-divider></mat-divider>

    <button mat-menu-item type="button" (click)="scrollTo('universe')">
      <span>{{ translate.isPt() ? 'UNIVERSO' : 'UNIVERSE' }}</span>
    </button>
    <button mat-menu-item type="button" (click)="scrollTo('latest-signal')">
      <span>{{ translate.isPt() ? 'ÚLTIMO SINAL' : 'LATEST SIGNAL' }}</span>
    </button>
    <a mat-menu-item routerLink="/creator"><span>{{ navText.creator }}</span></a>
  </mat-menu>
</mat-toolbar>

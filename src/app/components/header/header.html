<mat-toolbar color="primary">
  <a routerLink="/" class="brand-logo" aria-label="Home">
    RQS Base &uArr;
  </a>

  <span class="spacer"></span>

  <div class="desktop-nav">
    <button mat-button (click)="translate.toggle()">
      {{ translate.isPt() ? '🇺🇸 EN' : '🇧🇷 PT' }}
    </button>

   @if (!isJonahMode()) {
     <!-- SE ESTIVER NO MODO BROKLIN (Mostra o botão pra ir pro Jonah) -->
     <button mat-button class="jonah-trigger" (click)="activateJonahMode()">
          {{ navText.darkmode }} <!-- Texto: "MODO JONAH" -->
     </button>
   } @else {
     <!-- SE ESTIVER NO MODO JONAH (Mostra o botão pra voltar pro Broklin) -->
     <button mat-button class="broklin-escape" (click)="activateBroklinMode()">
      <mat-icon>shield</mat-icon> <!-- Ícone de Escudo/Segurança -->
      {{ navText.lightmode }} <!-- Texto: "VOLTAR À BASE" -->
     </button>
   }

     <a mat-button [routerLink]="['/dossier']">{{ navText.sobre }}</a>
     <a mat-button [routerLink]="['/saga']">{{ navText.visualNovel }}</a>

    <a mat-button [routerLink]="['/bio']" target="_blank" rel="noopener noreferrer">
  <mat-icon>hub</mat-icon>
  {{ navText.bio }}
    </a>

    <button mat-button [routerLink]="['/creator']" class="btn-creator">
      <mat-icon>terminal</mat-icon> {{ navText.creator }}
    </button>

    <button mat-button [routerLink]="['/discografia']">{{ navText.discografia }}</button>

    <button mat-button [routerLink]="['/store']" class="store-container">
      {{ navText.store }} <mat-icon iconPositionEnd>open_in_new</mat-icon>
    </button>
  </div>

  <button mat-icon-button [matMenuTriggerFor]="mobileMenu" class="mobile-menu-btn">
    <mat-icon>menu</mat-icon>
  </button>

  <mat-menu #mobileMenu="matMenu" xPosition="before" class="cyber-menu">
    <button mat-menu-item (click)="translate.toggle()">
      <mat-icon>translate</mat-icon>
      <span>{{ translate.isPt() ? 'Mudar idioma' : 'Switch Language' }}</span>
    </button>

    <mat-divider></mat-divider>

    @if (isJonahMode()) {
      <button mat-menu-item class="nav-item-broklin" (click)="activateBroklinMode()">
        <mat-icon>diamond</mat-icon> <span>{{ translate.isPt() ? 'Modo Broklin' : 'Broklin Mode' }}</span>
      </button>
    } @else {
      <button mat-menu-item class="nav-item-jonah" (click)="activateJonahMode()">
        <mat-icon>warning</mat-icon> <span>{{ translate.isPt() ? 'Modo Jonah' : 'Jonah Mode' }}</span>
      </button>
    }

    <mat-divider></mat-divider>

    <a mat-menu-item [routerLink]="['/creator']">
      <mat-icon style="color: var(--accent-color);">terminal</mat-icon>
      <span style="color: var(--accent-color); font-weight: bold;">{{ navText.creator }}</span>
    </a>

    <a mat-menu-item [routerLink]="['/dossier']">{{ navText.sobre }}</a>
    <a mat-menu-item [routerLink]="['/saga']">{{ navText.visualNovel }}</a>

    <mat-divider></mat-divider>

    <a mat-menu-item [routerLink]="['/bio']" target="_blank" rel="noopener noreferrer">
    <mat-icon>hub</mat-icon>
    <span>{{ navText.bio }}</span>
    </a>

    <a mat-menu-item [routerLink]="['/discografia']">DISCOGRAFIA</a>
    <a mat-menu-item [routerLink]="['/store']">{{ navText.store }}</a>
  </mat-menu>
</mat-toolbar>
